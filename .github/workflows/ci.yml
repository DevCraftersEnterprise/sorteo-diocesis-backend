name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL: 'false'
      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: ci-test-key
      CLOUDINARY_API_SECRET: ci-test-secret
      ENCRYPTION_KEY: ci0123456789abcdef
      PHONE_SALT: ci-test-salt
      FIREBASE_PROJECT_ID: ci-test-project
      FIREBASE_CLIENT_EMAIL: ci@ci-test-project.iam.gserviceaccount.com
