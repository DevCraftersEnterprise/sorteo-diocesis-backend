    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Lint (sin autofix — debe fallar si hay algo mal, no corregirlo en silencio)
        run: npm run lint:ci

      - name: Tests unitarios
        run: npm run test

      - name: Migrar base de datos (Postgres efímero de CI)
        run: npm run migrate:up:ci

      - name: Tests e2e
        run: npm run test:e2e

      - name: Build de producción
        run: npm run build
